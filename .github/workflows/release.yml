name: Release

on:
  push:
    tags:
      - "v*"

# Permissions are scoped per job rather than workflow-wide: only the
# `release` job publishes artifacts, so `test` and `build` run
# read-only and cannot inherit the write/attestation grants.
permissions: {}

jobs:
  # A tag can be pushed on any commit; nothing guarantees it went
  # through a gated PR. Run the unit suite before anything is built,
  # signed, or attested so an untested commit cannot become a release.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o ovn-network-agent-${{ matrix.goos }}-${{ matrix.goarch }} .

      - name: Build .deb package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          GOARCH=${{ matrix.goarch }} VERSION="${VERSION}" nfpm package --packager deb --target .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ovn-network-agent-${{ matrix.goos }}-${{ matrix.goarch }}
            ovn-network-agent_*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/sbom.cyclonedx.json

      - name: Create checksums
        working-directory: artifacts
        run: sha256sum ovn-network-agent-linux-* ovn-network-agent_*.deb sbom.cyclonedx.json > checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            artifacts/ovn-network-agent-linux-*
            artifacts/ovn-network-agent_*.deb

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifacts with cosign
        working-directory: artifacts
        run: |
          for file in ovn-network-agent-linux-* ovn-network-agent_*.deb sbom.cyclonedx.json checksums.txt; do
            cosign sign-blob --yes --bundle="${file}.bundle" "${file}"
          done

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            artifacts/ovn-network-agent-linux-amd64
            artifacts/ovn-network-agent-linux-arm64
            artifacts/ovn-network-agent_*.deb
            artifacts/sbom.cyclonedx.json
            artifacts/checksums.txt
            artifacts/*.bundle
