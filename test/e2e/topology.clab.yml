# Containerlab topology for the ovn-network-agent E2E harness.
#
#   central                    — ovn-northd + NB/SB ovsdb-server
#   gateway-{1,2,3}            — OVS userspace + ovn-controller + FRR + agent
#   upstream                   — FRR BGP peer for the gateways
#   client-{1,2}               — reachability probes attached to upstream
#
# Layout:
#   * containerlab's default management network connects every node and
#     resolves them by name; the gateway agent talks to `central` here.
#   * each gateway has a dedicated point-to-point underlay link to
#     `upstream` (eth1 on both sides) carrying the BGP session.
#   * each client has a point-to-point link to `upstream` so the upstream
#     router is its egress towards FIPs announced by the gateways.
#
# Build the images with `make e2e-up`. The image tags below match the
# Makefile targets.

name: ovn-e2e

mgmt:
  network: ovn-e2e-mgmt
  ipv4-subnet: 172.30.0.0/24

topology:
  defaults:
    env:
      # Forwarded into the gwnode entrypoint so each chassis registers
      # under a stable name.
      OVN_SB_REMOTE: tcp:central:6642
      # Deploy-time switch for the drain-hitless scenario (issue #113):
      # `E2E_DRAIN_ON_SHUTDOWN=true make e2e-up` deploys gateways whose
      # agent drains on SIGTERM. The agent's env layer beats the
      # `drain_on_shutdown: false` in gwnode-config.yaml, and the flag
      # stays off for every other scenario — pf-hairpin restarts the
      # master and must not hand mastership away. Non-gateway nodes
      # ignore the variable.
      OVN_NETWORK_DRAIN_ON_SHUTDOWN: ${E2E_DRAIN_ON_SHUTDOWN:=false}

  kinds:
    linux:
      # All containers in this lab need network-admin level capability for
      # OVS / ovn-controller / FRR / nftables to work. containerlab adds
      # NET_ADMIN/SYS_ADMIN by default for linux kind; bind extra paths
      # OVS needs at runtime.
      binds:
        - /lib/modules:/lib/modules:ro

  nodes:
    central:
      kind: linux
      image: ovn-network-agent/central:e2e
      ports:
        - 6641:6641/tcp
        - 6642:6642/tcp

    gateway-1:
      kind: linux
      image: ovn-network-agent/gwnode:e2e
      env:
        CHASSIS_NAME: gateway-1
      # Create the gateways only after `central` is up: the gwnode
      # entrypoint resolves the SB remote (`central`) by name, and a
      # gateway created before central could reach that lookup while the
      # name was still unregistered. The entrypoint retries the lookup
      # (see resolve_sb_remote in gwnode-entrypoint.sh); this ordering
      # removes the race entirely instead of merely surviving it.
      stages:
        create:
          wait-for:
            - node: central
              stage: create

    gateway-2:
      kind: linux
      image: ovn-network-agent/gwnode:e2e
      env:
        CHASSIS_NAME: gateway-2
      # See gateway-1.
      stages:
        create:
          wait-for:
            - node: central
              stage: create

    gateway-3:
      kind: linux
      image: ovn-network-agent/gwnode:e2e
      env:
        CHASSIS_NAME: gateway-3
      # See gateway-1.
      stages:
        create:
          wait-for:
            - node: central
              stage: create

    upstream:
      kind: linux
      # Pinned by digest so a registry-side change cannot alter the lab
      # silently. Docker Hub's frrouting/frr is frozen at FRR 8.4 (last
      # push 2022) — maintained images live on quay.io/frrouting/frr. The
      # intermittent `bgpd crashed in startup, signal 11` seen in CI is
      # inherent to this old build (bootstrap.sh retries the start);
      # upgrading to a maintained FRR is a separate, behavior-changing
      # step.
      image: frrouting/frr:latest@sha256:990e83490108b686fd6df3b1cafa6bdbb2714acb00eedb9a89693946f46f45ce

    client-1:
      kind: linux
      # v0.16 is the exact image `latest` resolved to when the pin
      # landed — same content, now immutable and Renovate-updatable.
      image: nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
      # Stay alive without a service — netshoot exits otherwise.
      cmd: "sleep infinity"

    client-2:
      kind: linux
      image: nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
      cmd: "sleep infinity"

  links:
    # Underlay: gateway <-> upstream (BGP peering).
    - endpoints: [gateway-1:eth1, upstream:eth1]
    - endpoints: [gateway-2:eth1, upstream:eth2]
    - endpoints: [gateway-3:eth1, upstream:eth3]
    # Clients hang off the upstream router for reachability tests.
    - endpoints: [client-1:eth1, upstream:eth4]
    - endpoints: [client-2:eth1, upstream:eth5]
