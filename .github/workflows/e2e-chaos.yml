name: E2E Chaos

# The seeded chaos runner lives in its own workflow, apart from e2e.yml:
# every job there asserts one fault and leaves the lab baseline-green,
# while the runner injects a randomized *sequence* and deliberately
# leaves the master wherever the last election put it, so it is not
# something to hang off every PR. This workflow is its CI path — the one
# place `execCommander`, the `containerlab tools veth create` re-wire and
# the collector actually run against a real lab — on three triggers, none
# of them the default ~15 min PR gate:
#
#   - Nightly (`schedule`): accumulating seeded exploration. Each night
#     sweeps the curated profiles as a matrix, one job per profile at the
#     runner-default 10 minutes, with the seed set to the run id so
#     successive nights explore different action sequences. The seed is
#     echoed to the run log and recorded in the uploaded run record, so a
#     failing night is replayable from its own artifacts.
#   - Dispatch (`workflow_dispatch`): the exact replay path. Dispatching
#     with the seed, profile and duration recorded in a failing nightly
#     job reruns that job exactly. Also the ad-hoc path: dispatch it from
#     the Actions tab when you touch the agent's failover, drain or
#     chassis-cleanup paths.
#   - PR smoke (`pull_request: labeled`): applying the `chaos-smoke` label
#     opts a single PR into a 3-minute seed-42 `everything-on` smoke,
#     rather than adding chaos to every PR in the suite.
#
# The nightly and dispatch paths run on the org's self-hosted runners.
# A chaos session is a 40-minute budget over a real containerlab lab,
# and the pool has headroom the hosted runners do not. Two prerequisites
# come with that. The runners need root on a real kernel — the
# `e2e-lab-setup` action modprobes `openvswitch`, `vrf` and `sch_netem`
# on the host — so a containerised runner has to be privileged. And the
# lab name `ovn-e2e` is fixed in the topology, so two chaos jobs must
# never share a machine: the pool is sized one job per host, and the
# leftover-lab sweep below covers the case where a hard-killed job left
# the previous lab behind.
#
# The PR smoke stays on `ubuntu-latest`. This repository is public, and
# a `pull_request` run builds and runs the PR's own images with sudo; on
# a throwaway VM that is contained, on a persistent org machine it would
# not be. The `chaos-smoke` label gate is a cost gate, not a trust
# boundary, so it is not what should be standing between a fork's
# Dockerfile and the runner pool.
#
# Unlike the e2e.yml jobs there is no separate baseline gate here: the
# runner refuses to start against a lab whose combined start state (a
# superset of the baseline) never goes green, and reports that as exit
# code 2 — distinct from a real violation (exit 1).
on:
  workflow_dispatch:
    # The defaults (`-seed 42 -duration 10m -profile everything-on`)
    # match a nightly everything-on job's duration and profile, not its
    # seed — nightly jobs seed from the run id. To replay a specific
    # nightly job, dispatch with the seed, profile and duration read back
    # from that job's artifacts; the fixed seed then reproduces its
    # action sequence exactly.
    inputs:
      seed:
        description: RNG seed for the fault sequence (same seed, same sequence)
        required: false
        default: "42"
      duration:
        description: Fault-injection duration, Go syntax (bounded by the 40-minute job timeout)
        required: false
        default: "10m"
      profile:
        description: Curated chaos profile to replay (profiles listed in registry order)
        required: false
        type: choice
        default: everything-on
        options:
          - everything-on
          - flat-minimal
          - flat-dnat
          - vlan-no-dnat
          - pf-only
          - heterogeneous
  # Nightly, off the hour, staggered clear of the Monday 05:00–06:00 UTC
  # weekly-cron burst (govulncheck/test/codeql/scorecard).
  schedule:
    - cron: "17 3 * * *"
  # Only the `chaos-smoke` label opts a PR in — the gate that acts on it
  # lives on the `params` job below, so the default PR gate stays at its
  # current cost. Applying the label needs triage permission, which is
  # the cost gate.
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: read

jobs:
  # Resolve the run inputs — the profile matrix, the seed, the duration
  # and the runner label — once, per trigger, so the chaos job below
  # reads them the same way on every path. No checkout: the job only
  # writes strings, which is also why this job stays on `ubuntu-latest`
  # rather than occupying a lab machine for a `case` statement.
  params:
    name: Resolve run inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Unrelated label events skip the whole run; the `chaos` job inherits
    # the skip through `needs`. This is the PR cost gate — a PR runs
    # chaos only once someone with triage permission applies the
    # `chaos-smoke` label.
    if: github.event_name != 'pull_request' || github.event.label.name == 'chaos-smoke'
    outputs:
      profiles: ${{ steps.resolve.outputs.profiles }}
      runner: ${{ steps.resolve.outputs.runner }}
      seed: ${{ steps.resolve.outputs.seed }}
      duration: ${{ steps.resolve.outputs.duration }}
    steps:
      - name: Resolve inputs per trigger
        id: resolve
        # The dispatch inputs travel through env instead of being
        # interpolated into the script, so a dispatch payload can never
        # inject shell syntax into it (same rule as the run step below).
        #
        # The nightly profile list is duplicated here and in the dispatch
        # `choice` options above because a `choice` input's options cannot
        # be computed. `TestChaosWorkflowSweepsEveryProfile` in
        # test/e2e/chaos/profiles_test.go guards both lists against drift
        # from the registry in test/e2e/chaos/profiles.go.
        env:
          INPUT_SEED: ${{ inputs.seed }}
          INPUT_DURATION: ${{ inputs.duration }}
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          case "${GITHUB_EVENT_NAME}" in
          schedule)
            # Nightly: sweep every curated profile, seed = the run id so
            # each night is a different (recorded, replayable) sequence.
            profiles='["everything-on","flat-minimal","flat-dnat","vlan-no-dnat","pf-only","heterogeneous"]'
            runner="self-hosted"
            seed="${GITHUB_RUN_ID}"
            duration="10m"
            ;;
          workflow_dispatch)
            # Replay/ad-hoc: a single chosen profile at the dispatched
            # seed and duration.
            profiles="[\"${INPUT_PROFILE}\"]"
            runner="self-hosted"
            seed="${INPUT_SEED}"
            duration="${INPUT_DURATION}"
            ;;
          pull_request)
            # PR smoke: one profile, a fixed seed, a short fault window —
            # and a throwaway hosted VM, because this is the one trigger
            # that runs a fork's own code (see the header).
            profiles='["everything-on"]'
            runner="ubuntu-latest"
            seed="42"
            duration="3m"
            ;;
          esac
          # seed and duration are written to GITHUB_OUTPUT below, and on
          # the dispatch path they are free-form inputs. Passing them
          # through env blocks shell injection but not GITHUB_OUTPUT
          # injection: a newline in the value opens a second `key=value`
          # line. Since profiles= and runner= are written before seed=, an
          # injected `profiles=[...]` or `runner=...` line lands after the
          # constrained one, wins as the last value for the key, and either
          # fans the matrix out to attacker-chosen values or picks the
          # machine the chaos job lands on. Reject anything but a bare
          # non-negative integer seed, and forbid a newline in duration.
          # The schedule and PR paths set literals that pass unchanged.
          case "${seed}" in
          ''|*[!0-9]*)
            echo "seed must be a non-negative integer, got: ${seed}" >&2
            exit 1
            ;;
          esac
          case "${duration}" in
          *$'\n'*)
            echo "duration must not contain a newline" >&2
            exit 1
            ;;
          esac
          # Echoing to the run log is what records the resolved nightly
          # seed there; the runner also records it in the uploaded
          # summary.json and journal.jsonl. Writing the same four values
          # to GITHUB_OUTPUT is what the matrix, the chaos job's runs-on
          # and the chaos job's run step read.
          echo "profiles: ${profiles}"
          echo "runner: ${runner}"
          echo "seed: ${seed}"
          echo "duration: ${duration}"
          {
            echo "profiles=${profiles}"
            echo "runner=${runner}"
            echo "seed=${seed}"
            echo "duration=${duration}"
          } >> "${GITHUB_OUTPUT}"

  chaos:
    name: Seeded chaos session (${{ matrix.profile }})
    # Resolved per trigger by `params`: `self-hosted` for the nightly and
    # dispatch paths, `ubuntu-latest` for the PR smoke. The header
    # explains why the PR path is the one that stays hosted.
    runs-on: ${{ needs.params.outputs.runner }}
    needs: params
    # fail-fast: false keeps one profile's failure from cancelling the
    # other five nightly jobs — each profile's run is worth its own
    # artifact bundle.
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.params.outputs.profiles) }}
    # Budget for one bring-up (~10 min incl. image builds), the profile
    # apply (up to three gateway restarts), the 10-minute wall-clock
    # fault window, the final settle (≤ the runner's 2m settle timeout
    # plus confirmation), ≤2 min of lab-state collection and teardown. A
    # `timeout-minutes` cancellation is not a failure, so keeping the cap
    # a backstop (rather than the thing that ends the run) is what lets
    # the runner still dump its own lab-state bundle on the failure path.
    timeout-minutes: 40

    env:
      E2E_TOPOLOGY: test/e2e/topology.clab.yml
      LAB: ovn-e2e

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Install the pinned containerlab release and load the kernel
      # modules the topology needs. The rationale for both lives in the
      # e2e-lab-setup composite action. Placed after checkout because a
      # local composite action needs the repository on disk.
      - uses: ./.github/actions/e2e-lab-setup

      # Unlike the scenarios, the runner is a Go program: it needs the
      # toolchain go.mod pins, not whatever the runner image ships.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # A hosted runner hands every job a fresh VM; a self-hosted one
      # hands it whatever the last job left behind. A chaos job that died
      # outside its own teardown — runner restart, OOM, a cancellation
      # that outran the grace period — leaves `clab-ovn-e2e-*` containers
      # and the topology's docker networks in place, and `containerlab
      # deploy` will not deploy over them. Without this sweep that machine
      # stays red every night until someone logs in. `|| true` because
      # having nothing to destroy is the normal case, and always the case
      # on the hosted PR path.
      - name: Destroy a lab left behind by an earlier run
        run: make e2e-down || true

      - name: Bring the lab up
        run: make e2e-up

      - name: Run the chaos session
        # The inputs travel through env instead of being interpolated
        # into the run script, so a dispatch payload can never inject
        # shell syntax into the command line.
        env:
          CHAOS_SEED: ${{ needs.params.outputs.seed }}
          CHAOS_DURATION: ${{ needs.params.outputs.duration }}
          CHAOS_PROFILE: ${{ matrix.profile }}
        run: make e2e-chaos CHAOS_FLAGS="-duration ${CHAOS_DURATION} -seed ${CHAOS_SEED} -profile ${CHAOS_PROFILE} -out ${RUNNER_TEMP}/chaos"

      # The report is the run record rendered for a human — verdict,
      # recovery durations, probe-loss windows attributed to the faults
      # they overlapped — so a triager reads the job summary instead of
      # downloading the artifact and querying it by hand. `if: always()`
      # because a failed run is the one whose report matters most; the
      # guard covers the runs that died before the runner wrote a record
      # (a `make e2e-up` failure), where there is nothing to render. A
      # render error past the guard fails the step on purpose: a green
      # run with a broken report is a report bug worth surfacing, and the
      # chaos step above already carries the run's own verdict either way.
      - name: Render the run report into the job summary
        if: always()
        run: |
          if [ ! -f "${RUNNER_TEMP}/chaos/summary.json" ]; then
            echo "No chaos run record was produced — the run died before the runner wrote one." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          go run ./test/e2e/chaos -report "${RUNNER_TEMP}/chaos" >> "${GITHUB_STEP_SUMMARY}"

      # The runner dumps `lab-state/` into the out directory itself on any
      # non-zero exit, but a `make e2e-up` failure dies before the runner
      # ever starts. This guard collects lab state in exactly that case
      # and never double-collects. (The job-level LAB env already serves
      # collect-artifacts.sh.)
      - name: Collect failure artifacts
        if: failure()
        run: |
          [ -d "${RUNNER_TEMP}/chaos/lab-state" ] || ./test/e2e/scenarios/collect-artifacts.sh "${RUNNER_TEMP}/chaos/lab-state"

      # Uploaded on every outcome, not just failure: the journal and the
      # run summary are the artifact the run exists to produce, and a
      # green run's recovery durations are what a later regression is
      # compared against. The runner dumps `lab-state/` into the same
      # directory itself when it does not pass.
      - name: Upload the chaos artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts-chaos-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chaos
          if-no-files-found: warn
          retention-days: 7

      # Always tear the lab down so a partial-failure run does not leak
      # docker networks/containers on the self-hosted machine. `if:
      # always()` runs this step even when an earlier step failed — and
      # even on cancellation, which is why it, not the pre-run sweep
      # above, is the primary cleanup. The sweep only has to cover the
      # deaths that skip this step entirely.
      - name: Tear the lab down
        if: always()
        run: make e2e-down
