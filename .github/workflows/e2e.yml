name: E2E

# The containerlab harness boots three OVN+OVS+FRR gateway containers
# plus a central node and clients, and even on the green path eats
# ~10 min of runner time. It runs on pull requests so authors can debug
# topology-level regressions on the same runners CI uses — the GHA
# environment differs enough from local Docker hosts (kernel, resource
# limits, image caches) that lab-up failures often only reproduce here —
# and on `workflow_dispatch` for manual reruns. It deliberately does not
# run on push to `main`: the merged commit already passed E2E on its PR,
# so re-running this ~10 min suite post-merge only burns runner time.
on:
  pull_request:
    branches: [main]
    # E2E is deliberately NOT a required status check, so an `on.paths`
    # filter is safe here: docs-only PRs simply do not trigger the ~10
    # min lab suite. If E2E ever becomes required, replace this with the
    # job-level conditional-skip pattern used in integration.yml, or the
    # required check will hang Pending on docs-only PRs.
    #
    # This docs-only set (docs/**, **.md) is the same predicate the
    # integration.yml `changes` job encodes as a shell grep. Keep the two
    # in sync — broadening the set here means updating that grep too, or
    # the two suites will treat the same PR inconsistently.
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs only for PRs; push/schedule runs on main are
  # the green-main signal and must never cancel each other mid-history.
  # A force-push that supersedes a PR can otherwise leave up to eight
  # ~15 min lab runners churning on stale commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: Baseline reachability
    runs-on: ubuntu-latest
    # Hard upper bound matching the issue's "~10-15 min budget".
    timeout-minutes: 15

    env:
      E2E_TOPOLOGY: test/e2e/topology.clab.yml
      LAB: ovn-e2e

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Install the pinned containerlab release and load the kernel
      # modules the topology needs. The rationale for both lives in the
      # e2e-lab-setup composite action. Placed after checkout because a
      # local composite action needs the repository on disk.
      - uses: ./.github/actions/e2e-lab-setup

      - name: Bring the lab up
        run: make e2e-up

      - name: Run baseline scenario
        run: ./test/e2e/scenarios/baseline.sh

      - name: Collect failure artifacts
        if: failure()
        run: |
          ./test/e2e/scenarios/collect-artifacts.sh "${RUNNER_TEMP}/e2e-artifacts"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: warn
          retention-days: 7

      # Always tear the lab down so a partial-failure run does not leak
      # docker networks/containers on a self-hosted runner. `if:
      # always()` runs this step even when an earlier step failed.
      - name: Tear the lab down
        if: always()
        run: make e2e-down

  failover:
    name: HA failover (${{ matrix.variant }})
    runs-on: ubuntu-latest
    # Runs after the baseline job, but on its own runner so a failover
    # regression is reported in isolation from the baseline path. Same
    # 15-minute budget — the default leg only adds ~30s of failover
    # wait on top of the baseline gate, the strict leg the ~40s
    # ping-flood window of issue #131.
    needs: baseline
    timeout-minutes: 15

    # The strict leg is the same scenario with LOSS_BUDGET set, so it
    # is a matrix leg rather than a copy of this job. fail-fast is off
    # so a strict-budget breach still lets the plain re-election leg
    # report its own result.
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: failover
            variant: "master chassis loss"
            loss_budget: ""
          - id: failover-strict
            variant: "strict ~2s outage budget"
            loss_budget: "2"

    env:
      E2E_TOPOLOGY: test/e2e/topology.clab.yml
      LAB: ovn-e2e

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # See the baseline job / e2e-lab-setup action for the rationale.
      - uses: ./.github/actions/e2e-lab-setup

      - name: Bring the lab up
        run: make e2e-up

      - name: Run failover scenario
        # LOSS_BUDGET switches failover.sh into the strict variant: a
        # 0.1s-spaced ping flood from client-1 is captured with tcpdump
        # across the re-election and the largest reply gap must stay
        # within the budget (issue #131). Empty selects the default
        # variant. The pcap is directed into the shared artifact root
        # so collect-artifacts.sh and the uploader both pick it up.
        # `runner.temp` is only available at step scope, not the
        # job-level env block.
        env:
          LOSS_BUDGET: ${{ matrix.loss_budget }}
          ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts/${{ matrix.id }}
        run: ./test/e2e/scenarios/failover.sh

      - name: Collect failure artifacts
        if: failure()
        run: |
          ./test/e2e/scenarios/collect-artifacts.sh "${RUNNER_TEMP}/e2e-artifacts"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Tear the lab down
        if: always()
        run: make e2e-down

  hairpin:
    name: Same-chassis hairpin (two FIPs on master)
    runs-on: ubuntu-latest
    # Runs in parallel with failover (both gate on baseline) so a
    # hairpin regression is reported in isolation from the HA path.
    # Same 15-minute budget — the scenario adds the cost of one
    # bootstrap, the baseline gate, plus ~30s of reconcile wait and
    # 5 ping packets, well inside the 5-minute target in issue #108.
    needs: baseline
    timeout-minutes: 15

    env:
      E2E_TOPOLOGY: test/e2e/topology.clab.yml
      LAB: ovn-e2e

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # See the baseline job / e2e-lab-setup action for the rationale.
      - uses: ./.github/actions/e2e-lab-setup

      - name: Bring the lab up
        run: make e2e-up

      - name: Run hairpin scenario
        # Direct the scenario's before/after hairpin-flow snapshots
        # into the same artifact root so collect-artifacts.sh and the
        # uploader both pick them up. `runner.temp` is only available
        # at step scope, not the job-level env block.
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts/hairpin
        run: ./test/e2e/scenarios/hairpin.sh

      - name: Collect failure artifacts
        if: failure()
        run: |
          ./test/e2e/scenarios/collect-artifacts.sh "${RUNNER_TEMP}/e2e-artifacts"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts-hairpin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Tear the lab down
        if: always()
        run: make e2e-down

  multi-vlan:
    name: Multi-VLAN provider networks (two segments on master)
    runs-on: ubuntu-latest
    # Runs in parallel with failover and hairpin (all gate on baseline)
    # so a multi-segment regression is reported in isolation. Same
    # 15-minute budget — the scenario adds the cost of one bootstrap,
    # the baseline gate, plus a ≤60s convergence wait per segment check
    # and three 5-packet probes.
    needs: baseline
    timeout-minutes: 15

    env:
      E2E_TOPOLOGY: test/e2e/topology.clab.yml
      LAB: ovn-e2e

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # See the baseline job / e2e-lab-setup action for the rationale.
      - uses: ./.github/actions/e2e-lab-setup

      - name: Bring the lab up
        run: make e2e-up

      - name: Run multi-VLAN scenario
        # Direct the scenario's flow/link/route snapshots into the same
        # artifact root so collect-artifacts.sh and the uploader both
        # pick them up. `runner.temp` is only available at step scope,
        # not the job-level env block.
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts/multi-vlan
        run: ./test/e2e/scenarios/multi-vlan.sh

      - name: Collect failure artifacts
        if: failure()
        run: |
          ./test/e2e/scenarios/collect-artifacts.sh "${RUNNER_TEMP}/e2e-artifacts"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts-multi-vlan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Tear the lab down
        if: always()
        run: make e2e-down

  pf-external:
    name: Port-forward DNAT (external client, source IP preserved)
    runs-on: ubuntu-latest
    # Runs in parallel with failover and hairpin (all three gate on
    # baseline) so a port-forward regression is reported in isolation.
    # Same 15-minute budget — the scenario adds the cost of one
    # bootstrap, the baseline gate, plus ~5s of LB-row plumbing and a
    # single curl probe, well inside the 5-minute target in issue
    # #109.
    needs: baseline
    timeout-minutes: 15

    env:
      E2E_TOPOLOGY: test/e2e/topology.clab.yml
      LAB: ovn-e2e

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # See the baseline job / e2e-lab-setup action for the rationale.
      - uses: ./.github/actions/e2e-lab-setup

      - name: Bring the lab up
        run: make e2e-up

      - name: Run port-forward scenario
        # Direct the scenario's backend source-IP log capture into the
        # same artifact root so collect-artifacts.sh and the uploader
        # both pick it up — per issue #109's "backend source-IP log is
        # included in the artifact bundle on failure" acceptance
        # criterion. `runner.temp` is only available at step scope,
        # not the job-level env block.
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts/pf-external
        run: ./test/e2e/scenarios/pf-external.sh

      - name: Collect failure artifacts
        if: failure()
        run: |
          ./test/e2e/scenarios/collect-artifacts.sh "${RUNNER_TEMP}/e2e-artifacts"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts-pf-external-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Tear the lab down
        if: always()
        run: make e2e-down

  pf-hairpin:
    name: Port-forward hairpin (masquerade flag)
    runs-on: ubuntu-latest
    # Runs in parallel with failover, hairpin, and pf-external (all
    # four gate on baseline) so a hairpin-masquerade regression is
    # reported in isolation. 15-minute budget like the others — the
    # scenario adds the cost of one bootstrap, the baseline gate, two
    # `docker restart` cycles of gateway-1 and one ≤30s reconcile-and-
    # probe window per phase, which fits inside the 7-minute target in
    # issue #110.
    needs: baseline
    timeout-minutes: 15

    env:
      E2E_TOPOLOGY: test/e2e/topology.clab.yml
      LAB: ovn-e2e

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # See the baseline job / e2e-lab-setup action for the rationale.
      - uses: ./.github/actions/e2e-lab-setup

      - name: Bring the lab up
        run: make e2e-up

      - name: Run port-forward hairpin scenario
        # Direct the scenario's nft snapshots (phase1-off / phase2-on /
        # teardown) into the artifact root so collect-artifacts.sh and
        # the uploader both pick them up — per issue #110's
        # "`nft list table inet ovn-network-agent` output is captured
        # in the artifact bundle on failure" acceptance criterion.
        # `runner.temp` is only available at step scope, not the
        # job-level env block.
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts/pf-hairpin
        run: ./test/e2e/scenarios/pf-hairpin.sh

      - name: Collect failure artifacts
        if: failure()
        run: |
          ./test/e2e/scenarios/collect-artifacts.sh "${RUNNER_TEMP}/e2e-artifacts"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts-pf-hairpin-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Tear the lab down
        if: always()
        run: make e2e-down

  stale-chassis:
    name: Stale-chassis cleanup (hard kill)
    runs-on: ubuntu-latest
    # Runs after the failover job on its own runner so a stale-cleanup
    # regression is reported in isolation. Same 15-minute budget — the
    # scenario adds at most ~150s of wait time (grace + jitter +
    # reconcile + safety) on top of the baseline gate. The reduced
    # stale_chassis_grace_period (30s) is set in
    # test/e2e/gwnode-config.yaml per issue #111 so this job stays well
    # inside the 5-minute target.
    needs: failover
    timeout-minutes: 15

    env:
      E2E_TOPOLOGY: test/e2e/topology.clab.yml
      LAB: ovn-e2e

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # See the baseline job / e2e-lab-setup action for the rationale.
      - uses: ./.github/actions/e2e-lab-setup

      - name: Bring the lab up
        run: make e2e-up

      - name: Run stale-chassis scenario
        # Direct the scenario's NB-snapshot + peer-cleanup-log captures
        # into the same artifact root so collect-artifacts.sh and the
        # uploader both pick them up. `runner.temp` is only available
        # at step scope, not the job-level env block.
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts/stale-chassis
        run: ./test/e2e/scenarios/stale-chassis.sh

      - name: Collect failure artifacts
        if: failure()
        run: |
          ./test/e2e/scenarios/collect-artifacts.sh "${RUNNER_TEMP}/e2e-artifacts"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts-stale-chassis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Tear the lab down
        if: always()
        run: make e2e-down

  drain-hitless:
    name: Graceful drain vs hard kill (hitless)
    runs-on: ubuntu-latest
    # Runs after the stale-chassis job on its own runner so a
    # drain-hitless regression is reported in isolation. This is the
    # one job that does not fit the other three's 15-minute budget:
    # the scenario runs `baseline.sh` as a sanity gate, the graceful
    # arm, a full `make e2e-down && make e2e-up` recycle, `baseline.sh`
    # again to gate the recycled lab, then the hardkill arm. Counting
    # this job's own bring-up and teardown that is two lab deploys, two
    # destroys and two baseline runs — roughly twice the baseline job's
    # work — plus two ~21 s probes each followed by a failover wait.
    # 25 minutes keeps the cap a backstop rather than the thing that
    # ends the run: a `timeout-minutes` cancellation is not a failure,
    # so the `if: failure()` artifact steps below never run and the
    # aborted arm leaves no bundle to debug. Per issue #113.
    needs: stale-chassis
    timeout-minutes: 25

    env:
      E2E_TOPOLOGY: test/e2e/topology.clab.yml
      LAB: ovn-e2e
      # Arm the drain for this job only: topology.clab.yml forwards the
      # variable into the gateway containers as
      # OVN_NETWORK_DRAIN_ON_SHUTDOWN, where the agent's env layer beats
      # the `drain_on_shutdown: false` default in gwnode-config.yaml.
      # Job-level (not step-level) so the scenario's own mid-run
      # `make e2e-up` recycle deploys the same lab shape. Every other
      # E2E job keeps the no-drain default — pf-hairpin restarts the
      # master and must not hand mastership away.
      E2E_DRAIN_ON_SHUTDOWN: "true"

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # See the baseline job / e2e-lab-setup action for the rationale.
      - uses: ./.github/actions/e2e-lab-setup

      - name: Bring the lab up
        run: make e2e-up

      - name: Run drain-hitless scenario
        # Direct the scenario's per-arm captures (ping output, ICMP
        # sequence dump, transition timeline, drain log line,
        # Port_Binding snapshots, summary) into the same artifact root
        # so collect-artifacts.sh and the uploader both pick them up.
        # The scenario recycles the lab between arms itself; this job
        # only does the initial `make e2e-up` and the final
        # `make e2e-down`.
        #
        # RECYCLE_ON_EXIT=0 stops the scenario's EXIT trap from doing a
        # third `containerlab deploy` that this job would immediately
        # tear down again: it costs several minutes of the job's time
        # budget, and on the failure path it would destroy the very lab
        # state the collect step is about to dump.
        env:
          ARTIFACTS_DIR: ${{ runner.temp }}/e2e-artifacts/drain-hitless
          RECYCLE_ON_EXIT: "0"
        run: ./test/e2e/scenarios/drain-hitless.sh

      - name: Collect failure artifacts
        if: failure()
        run: |
          ./test/e2e/scenarios/collect-artifacts.sh "${RUNNER_TEMP}/e2e-artifacts"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-artifacts-drain-hitless-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: warn
          retention-days: 7

      - name: Tear the lab down
        if: always()
        run: make e2e-down
